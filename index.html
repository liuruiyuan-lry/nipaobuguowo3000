<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>张雪峰快跑</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ==================== 游戏主容器 ==================== -->
    <div class="game-wrapper">

        <!-- ===== 顶部信息栏 ===== -->
        <div class="game-header">
            <div class="title-section">
                <h1 class="game-title">张雪峰快跑</h1>
                <p class="game-hint">长按跳更高，按↓蹲下躲巧乐兹</p>
            </div>
            <div class="score-section">
                <div class="score-row">
                    当前分数 <span id="currentScore" class="score-value">0</span>
                </div>
                <div class="score-row">
                    HI <span id="highScore" class="score-value">0</span>
                </div>
            </div>
        </div>

        <!-- ===== 游戏画布 ===== -->
        <canvas id="gameCanvas"></canvas>

        <!-- ===== 移动端触控提示 ===== -->
        <div class="touch-hint" id="touchHint">
            👆 点击屏幕跳跃（长按跳更高）&nbsp;|&nbsp;👇 下滑蹲下躲障碍
        </div>
    </div>

    <!-- ==================== 音频元素 ==================== -->
    <!--
        ★ 素材替换指南 ★
        当前使用自动生成的占位音效（.wav）。
        当你获取到真正的张雪峰鬼畜音频后，替换 assets/ 目录下对应文件即可：
        - assets/bgm.mp3   → 背景音乐《张雪峰老师我还记得你》
        - assets/voice.mp3 → 台词音效「你跑不过我你信吗」
        - assets/death.mp3 → 死亡失败音效
    -->
    <audio id="bgMusic" loop preload="metadata">
        <!-- 🎵 张雪峰鬼畜音频《念张师》- 已就位！ -->
        <source src="assets/bgm.m4a" type="audio/mp4">
    </audio>

    <audio id="voiceLine" preload="metadata">
        <source src="assets/voice.wav" type="audio/wav">
    </audio>

    <audio id="deathSound" preload="metadata">
        <source src="assets/death.wav" type="audio/wav">
    </audio>

    <!-- ==================== 游戏核心脚本 ==================== -->
    <script src="js/game.js"></script>
</body>
</html>
