<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美羊羊 ~ Mei Yangyang</title>
<style>
    :root {
        --pink: #FF8FAB;
        --wool: #FFD0DC;
        --wool-light: #FFE0EA;
        --cream: #FFF5EE;
        --bow: #FF5580;
        --eye: #3D1F1A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 100vw;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(170deg, #FCE4EC 0%, #F8D0E0 25%, #FDE4EE 50%, #FAD6E2 75%, #FCE4EC 100%);
        background-size: 300% 300%;
        animation: bgShift 10s ease-in-out infinite;
        font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
        overflow-x: hidden;
        cursor: default;
        user-select: none;
        padding: 20px;
    }
    @keyframes bgShift {
        0%,100% { background-position: 0% 50%; }
        33% { background-position: 70% 100%; }
        66% { background-position: 30% 0%; }
    }

    /* ── Clouds ── */
    .clouds { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .cloud {
        position:absolute; background:rgba(255,255,255,0.45); border-radius:50%; filter:blur(24px);
    }
    .cloud:nth-child(1){ width:180px; height:60px; top:6%; left:3%; animation:drift 18s ease-in-out infinite; }
    .cloud:nth-child(2){ width:140px; height:50px; top:10%; right:6%; animation:drift 22s ease-in-out infinite 3s; }
    .cloud:nth-child(3){ width:200px; height:65px; top:4%; left:38%; animation:drift 20s ease-in-out infinite 7s; }
    .cloud:nth-child(4){ width:130px; height:45px; bottom:18%; left:8%; animation:drift 25s ease-in-out infinite 2s; }
    .cloud:nth-child(5){ width:160px; height:55px; bottom:22%; right:10%; animation:drift 19s ease-in-out infinite 5s; }
    @keyframes drift {
        0%,100%{ transform:translateX(0); }
        25%{ transform:translateX(35px); }
        50%{ transform:translateX(-25px); }
        75%{ transform:translateX(20px); }
    }

    /* ── Floating items ── */
    .decorations { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .float {
        position:absolute; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
    }
    .float.f1 { animation-name:floatUp; font-size:28px; }
    .float.f2 { animation-name:floatUp; font-size:22px; }
    .float.f3 { animation-name:twinkle; font-size:15px; }

    .float:nth-child(1){ left:3%; animation-duration:7.5s; animation-delay:0s; }
    .float:nth-child(2){ left:13%; animation-duration:9s; animation-delay:0.7s; }
    .float:nth-child(3){ left:23%; animation-duration:7s; animation-delay:1.5s; }
    .float:nth-child(4){ left:34%; animation-duration:8.5s; animation-delay:2.2s; }
    .float:nth-child(5){ left:45%; animation-duration:7.8s; animation-delay:0.4s; }
    .float:nth-child(6){ left:56%; animation-duration:8.2s; animation-delay:1.3s; }
    .float:nth-child(7){ left:66%; animation-duration:9.5s; animation-delay:2.8s; }
    .float:nth-child(8){ left:76%; animation-duration:7.2s; animation-delay:1.8s; }
    .float:nth-child(9){ left:86%; animation-duration:8.8s; animation-delay:0.9s; }
    .float:nth-child(10){ left:94%; animation-duration:7.5s; animation-delay:3.2s; }
    .float:nth-child(11){ left:4%; top:6%; animation-duration:3s; animation-delay:0s; }
    .float:nth-child(12){ left:22%; top:10%; animation-duration:2.5s; animation-delay:0.6s; }
    .float:nth-child(13){ left:40%; top:5%; animation-duration:3.2s; animation-delay:1.2s; }
    .float:nth-child(14){ left:58%; top:8%; animation-duration:2.8s; animation-delay:0.3s; }
    .float:nth-child(15){ left:75%; top:6%; animation-duration:3.5s; animation-delay:1.5s; }
    .float:nth-child(16){ left:90%; top:11%; animation-duration:2.6s; animation-delay:0.9s; }

    @keyframes floatUp {
        0%{ transform:translateY(108vh) translateX(0) rotate(0deg); opacity:0; }
        10%{ opacity:1; }
        90%{ opacity:1; }
        100%{ transform:translateY(-12vh) translateX(60px) rotate(360deg); opacity:0; }
    }
    @keyframes twinkle {
        0%,100%{ transform:scale(0.7); opacity:0.25; }
        50%{ transform:scale(1.7); opacity:1; }
    }

    /* ── Main ── */
    .main-container {
        position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:14px;
    }
    .title {
        font-size:clamp(38px, 8vw, 62px); font-weight:900;
        background:linear-gradient(135deg, #FF5580, #FF8FAB, #FFB3C6, #FF5580);
        background-size:300% 300%;
        -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
        animation:titleShine 4s ease-in-out infinite;
        letter-spacing:10px;
        filter:drop-shadow(2px 3px 5px rgba(255,85,128,0.25));
    }
    @keyframes titleShine {
        0%,100%{ background-position:0% 50%; }
        50%{ background-position:100% 50%; }
    }
    .subtitle {
        font-size:15px; color:#D4687C; letter-spacing:5px; font-weight:400; margin-top:-6px; opacity:0.75;
    }

    /* ── Sheep wrapper ── */
    .sheep-wrapper {
        position:relative;
        width:min(400px, 88vw);
        height:min(520px, 115vw);
        display:flex; align-items:center; justify-content:center;
        transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
        cursor:pointer;
        -webkit-tap-highlight-color:transparent;
    }
    .sheep-wrapper:hover { transform:scale(1.05); }
    .sheep-wrapper:active { transform:scale(0.96); }

    .sheep-svg {
        width:100%; height:100%;
        filter:drop-shadow(0 14px 32px rgba(255,143,171,0.28));
    }

    /* ── SVG animations ── */
    .sheep-svg .blink-group { animation:blink 3.5s ease-in-out infinite; transform-origin:center center; }
    @keyframes blink {
        0%,42%,56%,100%{ transform:scaleY(1); }
        49%{ transform:scaleY(0.05); }
    }

    .sheep-svg .arm-left-g {
        animation:waveL 2.6s ease-in-out infinite;
        transform-origin:140px 295px;
    }
    @keyframes waveL {
        0%,100%{ transform:rotate(0deg); }
        35%{ transform:rotate(18deg) translateY(-8px); }
        65%{ transform:rotate(-3deg); }
    }

    .sheep-svg .arm-right-g {
        animation:waveR 2.6s ease-in-out infinite 1.3s;
        transform-origin:250px 295px;
    }
    @keyframes waveR {
        0%,100%{ transform:rotate(0deg); }
        35%{ transform:rotate(-14deg) translateY(-5px); }
        70%{ transform:rotate(4deg); }
    }

    .sheep-svg .tail-g {
        animation:tailWag 1.6s ease-in-out infinite;
        transform-origin:270px 310px;
    }
    @keyframes tailWag {
        0%,100%{ transform:rotate(0deg); }
        25%{ transform:rotate(12deg); }
        75%{ transform:rotate(-12deg); }
    }

    .sheep-svg .bow-g {
        animation:bowBounce 2.8s ease-in-out infinite;
        transform-origin:195px 78px;
    }
    @keyframes bowBounce {
        0%,100%{ transform:translateY(0) rotate(0deg); }
        30%{ transform:translateY(-4px) rotate(3deg); }
        65%{ transform:translateY(0) rotate(-2deg); }
        85%{ transform:translateY(-2px) rotate(2deg); }
    }

    .sheep-svg .ear-l-g {
        animation:earFlopL 4s ease-in-out infinite;
        transform-origin:140px 130px;
    }
    @keyframes earFlopL {
        0%,100%{ transform:rotate(0deg); }
        45%{ transform:rotate(-6deg); }
        80%{ transform:rotate(4deg); }
    }
    .sheep-svg .ear-r-g {
        animation:earFlopR 4s ease-in-out infinite 0.6s;
        transform-origin:250px 130px;
    }
    @keyframes earFlopR {
        0%,100%{ transform:rotate(0deg); }
        45%{ transform:rotate(6deg); }
        80%{ transform:rotate(-4deg); }
    }

    .sheep-svg .body-g {
        animation:bodyBreathe 3s ease-in-out infinite;
        transform-origin:195px 310px;
    }
    @keyframes bodyBreathe {
        0%,100%{ transform:scaleY(1) scaleX(1); }
        50%{ transform:scaleY(1.03) scaleX(1.01); }
    }

    /* ── Speech bubble ── */
    .speech-bubble {
        position:absolute; top:-24px; left:50%; transform:translateX(-50%);
        background:rgba(255,255,255,0.92); backdrop-filter:blur(12px);
        border-radius:20px 20px 20px 4px; padding:12px 22px;
        font-size:15px; color:#D4687C; font-weight:600;
        box-shadow:0 6px 28px rgba(255,143,171,0.18);
        white-space:nowrap; z-index:10; opacity:0; pointer-events:none;
        animation:bubbleIn 0.5s ease-out 1.5s forwards;
    }
    @keyframes bubbleIn {
        0%{ opacity:0; transform:translateX(-50%) translateY(12px) scale(0.4); }
        100%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    }

    /* ── Info card ── */
    .info-card {
        position:relative; z-index:2;
        background:rgba(255,255,255,0.52); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
        border-radius:22px; padding:18px 36px; text-align:center;
        box-shadow:0 8px 36px rgba(255,143,171,0.12);
        border:1.5px solid rgba(255,255,255,0.7);
        transition:all 0.35s ease;
    }
    .info-card:hover {
        box-shadow:0 14px 48px rgba(255,143,171,0.22); transform:translateY(-4px);
    }
    .info-card .name-en { font-size:13px; color:#C06078; letter-spacing:5px; font-weight:400; margin-bottom:10px; }
    .traits { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    .trait-tag {
        padding:7px 18px;
        background:linear-gradient(135deg, #FFF0F5, #FFE0EA);
        border:1px solid #FFCCD9; border-radius:20px;
        font-size:13px; color:#D4687C; font-weight:500;
        transition:all 0.25s ease; cursor:default;
    }
    .trait-tag:hover {
        background:linear-gradient(135deg, #FF8FAB, #FFB3C6);
        color:#fff; border-color:transparent;
        transform:scale(1.08);
        box-shadow:0 5px 18px rgba(255,143,171,0.35);
    }
    .footer-note {
        position:relative; z-index:1; font-size:11px; color:#D4A0AE; letter-spacing:2px; margin-top:2px;
    }

    /* ── Heart burst ── */
    .burst {
        position:fixed; pointer-events:none; z-index:999; font-size:22px;
        animation:burstOut 1.3s ease-out forwards;
    }
    @keyframes burstOut {
        0%{ transform:translate(0,0) scale(0.2); opacity:1; }
        100%{ transform:translate(var(--bx),var(--by)) scale(2); opacity:0; }
    }

    /* ── Responsive ── */
    @media (max-width:480px) {
        .sheep-wrapper { width:92vw; height:118vw; }
        .speech-bubble { font-size:13px; padding:10px 16px; top:-18px; }
        .info-card { padding:14px 18px; }
        .trait-tag { padding:5px 12px; font-size:12px; }
        .title { letter-spacing:6px; }
    }
</style>
</head>
<body>

<div class="clouds" aria-hidden="true">
    <div class="cloud"></div><div class="cloud"></div><div class="cloud"></div>
    <div class="cloud"></div><div class="cloud"></div>
</div>

<div class="decorations" aria-hidden="true">

    <span class="float f3">✨</span><span class="float f3">⭐</span><span class="float f3">✨</span>
    <span class="float f3">💫</span><span class="float f3">✨</span><span class="float f3">⭐</span>
</div>

<div class="main-container">
    <h1 class="title">美 羊 羊</h1>
    <p class="subtitle">✦ 青青草原最可爱的小羊 ✦</p>

    <div class="sheep-wrapper" id="sheepWrapper">
        <div class="speech-bubble" id="speechBubble">大家好呀~ 💕</div>

        <svg class="sheep-svg" viewBox="0 0 390 510" xmlns="http://www.w3.org/2000/svg">

            <defs>
                <radialGradient id="woolG" cx="45%" cy="30%">
                    <stop offset="0%" stop-color="#FFE6EE"/>
                    <stop offset="35%" stop-color="#FFD0DC"/>
                    <stop offset="75%" stop-color="#F8B0C4"/>
                    <stop offset="100%" stop-color="#EE9AB0"/>
                </radialGradient>
                <radialGradient id="woolG2" cx="40%" cy="35%">
                    <stop offset="0%" stop-color="#FFEEF4"/>
                    <stop offset="50%" stop-color="#FFD8E4"/>
                    <stop offset="100%" stop-color="#F4ACC0"/>
                </radialGradient>
                <radialGradient id="faceG" cx="50%" cy="35%">

                </radialGradient>
                <linearGradient id="legG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#FFF0E8"/>
                    <stop offset="70%" stop-color="#FFE4D6"/>
                    <stop offset="100%" stop-color="#F0CCB8"/>
                </linearGradient>
                <linearGradient id="bowG" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#FF5078"/>
                    <stop offset="100%" stop-color="#FF8FAB"/>
                </linearGradient>
                <linearGradient id="hornG" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0%" stop-color="#E8D0B8"/>
                    <stop offset="50%" stop-color="#FDF5EC"/>
                    <stop offset="100%" stop-color="#DCC4A4"/>
                </linearGradient>
                <radialGradient id="earInG" cx="50%" cy="20%">
                    <stop offset="0%" stop-color="#FFD8E2"/>
                    <stop offset="100%" stop-color="#F4B4C4"/>
                </radialGradient>
            </defs>

            <!-- ═══════════ GROUND SHADOW ═══════════ -->
            <ellipse cx="200" cy="495" rx="100" ry="10" fill="rgba(232,117,144,0.15)">
                <animate attributeName="rx" values="100;110;100" dur="3s" repeatCount="indefinite"/>

            <ellipse cx="165" cy="493" rx="28" ry="7" fill="rgba(200,150,140,0.2)"/>

                <circle cx="287" cy="322" r="13" fill="#FFCCD8"/>
                <circle cx="296" cy="306" r="11" fill="#FFE0EA"/>
            </g>

            <!-- ═══════════ BODY (wool-covered torso, upright) ═══════════ -->
            <g class="body-g">
                <!-- Main body: large vertically-oriented oval -->
                <ellipse cx="195" cy="300" rx="78" ry="90" fill="url(#woolG)"/>

                <!-- Wool tufts around body for fluffy texture -->
                <!-- Top of body (chest/shoulder area) -->
                <circle cx="148" cy="245" r="28" fill="url(#woolG2)"/>
                <circle cx="178" cy="228" r="30" fill="#FFD8E4"/>
                <circle cx="212" cy="226" r="32" fill="url(#woolG2)"/>

                <circle cx="268" cy="278" r="26" fill="url(#woolG2)"/>
                <circle cx="272" cy="310" r="24" fill="#FFD4E0"/>

                <!-- Bottom of body -->

                <circle cx="215" cy="380" r="28" fill="url(#woolG2)"/>
                <circle cx="248" cy="365" r="26" fill="#FFD0DC"/>

                <!-- Mid-body filler tufts -->

                <circle cx="235" cy="320" r="22" fill="#FFD4E0"/>
                <circle cx="195" cy="240" r="22" fill="#FFDCE6"/>
                <circle cx="195" cy="370" r="22" fill="#FFD8E4"/>
                <circle cx="135" cy="295" r="20" fill="url(#woolG2)"/>
                <circle cx="258" cy="292" r="20" fill="url(#woolG2)"/>
            </g>

            <!-- ═══════════ LEGS (two legs, connected at bottom of body) ═══════════ -->
            <!-- Left leg -->
            <g>
                <path d="M160,365 Q155,405 152,440 Q148,475 155,488 L185,488 Q191,475 190,440 Q188,408 185,368"

            <!-- ═══════════ ARMS (two arms, connected at sides of upper body) ═══════════ -->

            <!-- Neck wool ring / scarf-like collar -->

            <!-- ═══════════ EARS ═══════════ -->

                <path d="M140,150 Q118,115 128,105 Q138,96 145,118 Q150,137 143,155"

                <path d="M139,144 Q125,118 130,110 Q138,105 142,120 Q146,135 141,146"

            <g class="ear-r-g">

<script>
const sheepWrapper = document.getElementById('sheepWrapper');
const speechBubble = document.getElementById('speechBubble');

const messages = [
    '嗨~ 你好呀! 💕',
    '今天也是美美的一天 ✨',
    '🌸 花花真好看~',
    '嘻嘻，被你发现啦 😊',
    '青青草原欢迎你~ 🌿',
    '🎀 我的蝴蝶结好看吗?',
    '要一起玩吗? 💖',
    '啦啦啦~ ♪',
    '送你一朵小花花 🌸',
    '你好可爱呀~ 💝',
];

sheepWrapper.addEventListener('click', (e) => {
    const msg = messages[Math.floor(Math.random() * messages.length)];
    speechBubble.textContent = msg;
    speechBubble.style.animation = 'none';
    speechBubble.offsetHeight;
    speechBubble.style.animation = 'bubbleIn 0.5s ease-out forwards';

    // Burst hearts
    const cx = e.clientX, cy = e.clientY;
    const emojis = ['💕','💖','💗','💝','🌸','✨','💐','🎀','🌷','💮'];

    for (let i = 0; i < 10; i++) {
        const el = document.createElement('span');
        el.className = 'burst';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = cx + 'px';
        el.style.top = cy + 'px';
        el.style.fontSize = (14 + Math.random() * 26) + 'px';
        const angle = (Math.PI * 2 / 10) * i + Math.random() * 0.3;
        const dist = 55 + Math.random() * 95;
        el.style.setProperty('--bx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--by', Math.sin(angle) * dist - 35 + 'px');
        el.style.animationDuration = (0.8 + Math.random() * 1.1) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }
});

// Auto-hide bubble
let hideTimer;
function resetBubbleTimer() {
    clearTimeout(hideTimer);
    speechBubble.style.opacity = '1';
    speechBubble.style.transition = 'none';
    hideTimer = setTimeout(() => {
        speechBubble.style.transition = 'opacity 0.6s ease-out';
        speechBubble.style.opacity = '0';
    }, 4000);
}
sheepWrapper.addEventListener('click', resetBubbleTimer);
resetBubbleTimer();

// Trait sparkle
document.querySelectorAll('.trait-tag').forEach(tag => {
    tag.addEventListener('mouseenter', () => {
        const r = tag.getBoundingClientRect();
        const s = document.createElement('span');
        s.textContent = '✨';
        s.style.cssText = `position:fixed;left:${r.right+4}px;top:${r.top-4}px;font-size:14px;pointer-events:none;z-index:999;--bx:0px;--by:-25px;animation:burstOut 0.6s ease-out forwards;`;
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 700);
    });
});

// 7-click rainbow easter egg
let clickCount = 0, clickTimer = null;
sheepWrapper.addEventListener('click', () => {
    clickCount++;
    if (clickCount >= 7) {
        document.body.style.transition = 'background 0.5s ease, background-size 0.5s ease';
        document.body.style.background = 'linear-gradient(170deg, #FFE0EC 0%, #FFD4F0 22%, #E0D4FF 44%, #D4F0FF 66%, #D4FFE0 88%, #FFF0D4 100%)';
        document.body.style.backgroundSize = '400% 400%';
        document.body.style.animation = 'bgShift 3s ease-in-out infinite';
        setTimeout(() => {
            document.body.style.background = '';
            document.body.style.backgroundSize = '300% 300%';
            document.body.style.animation = 'bgShift 10s ease-in-out infinite';
        }, 3500);
        clickCount = 0;
    }
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
});
</script>
